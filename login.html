<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BVenture</title>

    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/login.css"
    >

    <link
        rel="stylesheet"
        href="css/loading.css"
    >

    <link
        rel="stylesheet"
        href="css/conexao.css"
    >

    <!-- PWA -->

    <link rel="manifest" href="./manifest.json">

    <meta name="theme-color" content="#031923">

    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">

</head>


<body>


    <!-- =====================================================
         PARTÍCULAS
    ====================================================== -->

    <div
        class="particulas"
        aria-hidden="true"
    >

        <span class="particula p1"></span>
        <span class="particula p2"></span>
        <span class="particula p3"></span>
        <span class="particula p4"></span>
        <span class="particula p5"></span>
        <span class="particula p6"></span>
        <span class="particula p7"></span>
        <span class="particula p8"></span>
        <span class="particula p9"></span>
        <span class="particula p10"></span>
        <span class="particula p11"></span>
        <span class="particula p12"></span>

    </div>



    <!-- =====================================================
         CONTEÚDO
    ====================================================== -->

    <main class="login">


        <!-- =================================================
             ÁREA DOS FORMULÁRIOS
        ================================================== -->

        <div
            class="formularios-container"
            id="formulariosContainer"
        >


            <!-- =============================================
                 LOGIN
            ============================================== -->

            <section
                class="login-card formulario-card formulario-login"
                id="cardLogin"
            >


                <!-- LOGO -->

                <div class="logo-area">

                    <img
                        src="imagens-webp/logo.webp"
                        alt="BVenture"
                        class="logo-imagem"
                    >

                </div>


                <!-- CABEÇALHO -->

                <div class="login-card-cabecalho">

                    <h2>
                        Bem-vindo(a)!
                    </h2>

                    <p>
                        Entre na sua conta para continuar explorando.
                    </p>

                </div>


                <!-- FORMULÁRIO -->

                <form
                    class="login-form"
                    id="formLogin"
                >


                    <!-- E-MAIL -->

                    <div class="campo">

                        <label for="email">
                            E-mail
                        </label>

                        <div class="campo-input">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                aria-hidden="true"
                            >

                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M21.75 6.75v10.5A2.25 2.25 0 0 1 19.5 19.5h-15a2.25 2.25 0 0 1-2.25-2.25V6.75"
                                />

                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="m3 6 9 6 9-6"
                                />

                            </svg>


                            <input
                                type="email"
                                id="email"
                                placeholder="Digite seu e-mail"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>



                    <!-- SENHA -->

                    <div class="campo">

                        <div class="campo-label">

                            <label for="senha">
                                Senha
                            </label>


                            <button
                                type="button"
                                class="esqueci-senha"
                                id="esqueciSenha"
                            >
                                Esqueci minha senha
                            </button>

                        </div>


                        <div class="campo-input">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                aria-hidden="true"
                            >

                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M16.5 10.5V6.75a4.5 4.5 0 0 0-9 0v3.75"
                                />

                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M5.25 10.5h13.5v9H5.25z"
                                />

                            </svg>


                            <input
                                type="password"
                                id="senha"
                                placeholder="Digite sua senha"
                                autocomplete="current-password"
                                required
                            >


                            <button
                                type="button"
                                class="mostrar-senha"
                                id="mostrarSenha"
                                aria-label="Mostrar senha"
                            >

                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    aria-hidden="true"
                                >

                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M2.25 12s3.5-6 9.75-6 9.75 6 9.75 6-3.5 6-9.75 6S2.25 12 2.25 12Z"
                                    />

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="2.5"
                                    />

                                </svg>

                            </button>

                        </div>

                    </div>



                    <!-- ENTRAR -->

                    <button
                        type="submit"
                        class="botao-principal botao-entrar"
                    >
                        Entrar
                    </button>

                </form>



                <!-- DIVISOR -->

                <div class="divisor">

                    <span></span>

                    <p>
                        ou continue com
                    </p>

                    <span></span>

                </div>



                <!-- GOOGLE -->

                <button
                    type="button"
                    class="botao-google"
                    id="loginGoogle"
                >

                    <svg
                        class="google-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            fill="currentColor"
                            d="M21.35 11.1H12v2.98h5.38c-.23 1.5-1.72 4.4-5.38 4.4a6.48 6.48 0 0 1 0-12.96c2.08 0 3.47.89 4.27 1.65l2.91-2.8C17.31 2.62 14.88 1.5 12 1.5a10.5 10.5 0 1 0 0 21c6.06 0 10.08-4.26 10.08-10.26 0-.69-.08-1.14-.17-1.64Z"
                        />

                    </svg>

                    Continuar com Google

                </button>



                <!-- CRIAR CONTA -->

                <div class="criar-conta">

                    <span>
                        Ainda não possui uma conta?
                    </span>

                    <button
                        type="button"
                        class="trocar-formulario"
                        id="abrirCadastro"
                    >
                        Criar conta
                    </button>

                </div>

            </section>



            <!-- =============================================
                 CADASTRO
            ============================================== -->

            <section
                class="login-card formulario-card formulario-cadastro"
                id="cardCadastro"
                aria-hidden="true"
            >


                <!-- LOGO -->

                <div class="logo-area">

                    <img
                        src="imagens-webp/logo.webp"
                        alt="BVenture"
                        class="logo-imagem"
                    >

                </div>


                <!-- CABEÇALHO -->

                <div class="login-card-cabecalho">

                    <h2>
                        Crie sua conta
                    </h2>

                    <p>
                        Comece sua jornada pelo BVenture.
                    </p>

                </div>


                <!-- FORMULÁRIO -->

                <form
                    class="login-form"
                    id="formCadastro"
                >


                    <!-- E-MAIL -->

                    <div class="campo">

                        <label for="emailCadastro">
                            E-mail
                        </label>


                        <div class="campo-input">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                aria-hidden="true"
                            >

                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M21.75 6.75v10.5A2.25 2.25 0 0 1 19.5 19.5h-15a2.25 2.25 0 0 1-2.25-2.25V6.75"
                                />

                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="m3 6 9 6 9-6"
                                />

                            </svg>


                            <input
                                type="email"
                                id="emailCadastro"
                                placeholder="Digite seu e-mail"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>



                    <!-- SENHA -->

                    <div class="campo">

                        <label for="senhaCadastro">
                            Senha
                        </label>


                        <div class="campo-input">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                aria-hidden="true"
                            >

                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M16.5 10.5V6.75a4.5 4.5 0 0 0-9 0v3.75"
                                />

                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M5.25 10.5h13.5v9H5.25z"
                                />

                            </svg>


                            <input
                                type="password"
                                id="senhaCadastro"
                                placeholder="Crie uma senha"
                                autocomplete="new-password"
                                required
                            >


                            <button
                                type="button"
                                class="mostrar-senha"
                                id="mostrarSenhaCadastro"
                                aria-label="Mostrar senha"
                            >

                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    aria-hidden="true"
                                >

                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M2.25 12s3.5-6 9.75-6 9.75 6 9.75 6-3.5 6-9.75 6S2.25 12 2.25 12Z"
                                    />

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="2.5"
                                    />

                                </svg>

                            </button>

                        </div>

                    </div>



                    <!-- CONFIRMAR SENHA -->

                    <div class="campo">

                        <label for="confirmarSenha">
                            Confirmar senha
                        </label>


                        <div class="campo-input">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                aria-hidden="true"
                            >

                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M16.5 10.5V6.75a4.5 4.5 0 0 0-9 0v3.75"
                                />

                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M5.25 10.5h13.5v9H5.25z"
                                />

                            </svg>


                            <input
                                type="password"
                                id="confirmarSenha"
                                placeholder="Digite a senha novamente"
                                autocomplete="new-password"
                                required
                            >

                        </div>

                    </div>



                    <!-- CRIAR -->

                    <button
                        type="submit"
                        class="botao-principal botao-entrar"
                    >
                        Criar conta
                    </button>

                </form>



                <!-- DIVISOR -->

                <div class="divisor">

                    <span></span>

                    <p>
                        ou continue com
                    </p>

                    <span></span>

                </div>



                <!-- GOOGLE -->

                <button
                    type="button"
                    class="botao-google"
                    id="cadastroGoogle"
                >

                    <svg
                        class="google-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            fill="currentColor"
                            d="M21.35 11.1H12v2.98h5.38c-.23 1.5-1.72 4.4-5.38 4.4a6.48 6.48 0 0 1 0-12.96c2.08 0 3.47.89 4.27 1.65l2.91-2.8C17.31 2.62 14.88 1.5 12 1.5a10.5 10.5 0 1 0 0 21c6.06 0 10.08-4.26 10.08-10.26 0-.69-.08-1.14-.17-1.64Z"
                        />

                    </svg>

                    Continuar com Google

                </button>



                <!-- VOLTAR -->

                <div class="criar-conta">

                    <span>
                        Já possui uma conta?
                    </span>

                    <button
                        type="button"
                        class="trocar-formulario"
                        id="abrirLogin"
                    >
                        Entrar
                    </button>

                </div>

            </section>

        </div>

    </main>



    <!-- =====================================================
         POPUP DE AVISO
    ====================================================== -->

    <div
        class="popup-overlay"
        id="popupAviso"
        aria-hidden="true"
    >

        <div
            class="popup-aviso"
            role="alertdialog"
            aria-modal="true"
            aria-labelledby="popupTitulo"
        >


            <!-- FECHAR -->

            <button
                type="button"
                class="popup-fechar"
                id="fecharPopup"
                aria-label="Fechar aviso"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    aria-hidden="true"
                >

                    <path
                        stroke-linecap="round"
                        d="M6 6l12 12M18 6L6 18"
                    />

                </svg>

            </button>


            <!-- ÍCONE -->

            <div class="popup-icone">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                >

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M12 9v4m0 4h.01M10.3 3.7 2.7 17a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0Z"
                    />

                </svg>

            </div>


            <!-- TEXTO -->

            <h3 id="popupTitulo">
                Atenção!
            </h3>

            <p id="popupMensagem">
                Mensagem de aviso.
            </p>

        </div>

    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="js/idiomas.js"></script>
    <script src="js/loading.js"></script>
    <script src="js/conexao.js"></script>
    
    <script type="module" src="js/login.js"></script>
    
    <script src="./js/pwa.js"></script>


    
</body>

</html>

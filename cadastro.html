<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>BVenture | Cadastro</title>

    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/login.css"
    >

    <link
    rel="stylesheet"
    href="css/conexao.css"
>

    <!-- PWA -->

    <link rel="manifest" href="./manifest.json">

    <meta name="theme-color" content="#031923">

    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
</head>


<body>

    <!-- PARTÍCULAS -->

    <div class="particulas" aria-hidden="true">
        <span class="particula p1"></span>
        <span class="particula p2"></span>
        <span class="particula p3"></span>
        <span class="particula p4"></span>
        <span class="particula p5"></span>
        <span class="particula p6"></span>
        <span class="particula p7"></span>
        <span class="particula p8"></span>
        <span class="particula p9"></span>
        <span class="particula p10"></span>
        <span class="particula p11"></span>
        <span class="particula p12"></span>
    </div>


    <main class="login">

        <!-- LOGO -->



        <!-- CARD -->

        <section class="login-card">

            <div class="logo-area">

                <img
                    src="imagens-webp/logo.webp"
                    alt="BVenture"
                    class="logo-imagem"
                >

            </div>

            <div class="login-card-cabecalho">

                <h2>
                    Crie sua conta
                </h2>

                <p>
                    Comece sua jornada pelo BVenture.
                </p>

            </div>


            <form
                id="formCadastro"
                class="login-form"
            >

                <!-- E-MAIL -->

                <div class="campo">

                    <label for="emailCadastro">
                        E-mail
                    </label>

                    <div class="campo-input">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            aria-hidden="true"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M21.75 6.75v10.5A2.25 2.25 0 0 1 19.5 19.5h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0-8.69 5.517a2.25 2.25 0 0 1-2.42 0L2.25 6.75"
                            />
                        </svg>

                        <input
                            type="email"
                            id="emailCadastro"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- SENHA -->

                <div class="campo">

                    <label for="senhaCadastro">
                        Senha
                    </label>

                    <div class="campo-input">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            aria-hidden="true"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M16.5 10.5V6.75a4.5 4.5 0 0 0-9 0v3.75m-.75 0h10.5A2.25 2.25 0 0 1 19.5 12.75v6A2.25 2.25 0 0 1 17.25 21H6.75a2.25 2.25 0 0 1-2.25-2.25v-6A2.25 2.25 0 0 1 6.75 10.5Z"
                            />
                        </svg>

                        <input
                            type="password"
                            id="senhaCadastro"
                            name="senha"
                            placeholder="Crie uma senha"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="mostrar-senha"
                            id="mostrarSenhaCadastro"
                            aria-label="Mostrar senha"
                        >

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .638C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
                                />

                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                                />
                            </svg>

                        </button>

                    </div>

                </div>


                <!-- CONFIRMAR SENHA -->

                <div class="campo">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <div class="campo-input">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            aria-hidden="true"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M16.5 10.5V6.75a4.5 4.5 0 0 0-9 0v3.75m-.75 0h10.5A2.25 2.25 0 0 1 19.5 12.75v6A2.25 2.25 0 0 1 17.25 21H6.75a2.25 2.25 0 0 1-2.25-2.25v-6A2.25 2.25 0 0 1 6.75 10.5Z"
                            />
                        </svg>

                        <input
                            type="password"
                            id="confirmarSenha"
                            name="confirmarSenha"
                            placeholder="Digite a senha novamente"
                            autocomplete="new-password"
                            required
                        >

                    </div>

                </div>


                <!-- CRIAR CONTA -->

                <button
                    type="submit"
                    class="botao-principal botao-entrar"
                >
                    Criar conta
                </button>

            </form>


            <!-- DIVISOR -->

            <div class="divisor">

                <span></span>

                <p>ou continue com</p>

                <span></span>

            </div>


            <!-- GOOGLE -->

            <button
                type="button"
                class="botao-google"
                id="cadastroGoogle"
            >

                <svg
                    class="google-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path
                        fill="#4285F4"
                        d="M21.6 12.23c0-.71-.06-1.4-.18-2.06H12v3.9h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.9-1.75 2.98-4.33 2.98-7.37Z"
                    />

                    <path
                        fill="#34A853"
                        d="M12 22c2.7 0 4.98-.9 6.64-2.4l-3.24-2.51c-.9.6-2.05.96-3.4.96-2.61 0-4.82-1.76-5.61-4.13H3.05v2.59A10 10 0 0 0 12 22Z"
                    />

                    <path
                        fill="#FBBC05"
                        d="M6.39 13.92A6.02 6.02 0 0 1 6.08 12c0-.67.12-1.32.31-1.92V7.49H3.05A10 10 0 0 0 2 12c0 1.61.38 3.13 1.05 4.51l3.34-2.59Z"
                    />

                    <path
                        fill="#EA4335"
                        d="M12 5.95c1.47 0 2.79.5 3.83 1.49l2.87-2.87A9.64 9.64 0 0 0 12 2a10 10 0 0 0-8.95 5.49l3.34 2.59C7.18 7.71 9.39 5.95 12 5.95Z"
                    />

                </svg>

                <span>
                    Continuar com Google
                </span>

            </button>


            <!-- VOLTAR AO LOGIN -->

            <div class="criar-conta">

                <span>
                    Já possui uma conta?
                </span>

                <a href="login.html">
                    Entrar
                </a>

            </div>

        </section>

    </main>

    <!-- POPUP DE AVISO -->

    <div
        class="popup-overlay"
        id="popupAviso"
        aria-hidden="true"
    >
        ...
    </div>

    <!-- JAVASCRIPT DO CADASTRO -->
    <!-- JAVASCRIPT -->

    <script src="js/conexao.js"></script>

    <script
        type="module"
        src="js/cadastro.js">
    </script>
    <script src="./js/pwa.js"></script>
    
</body>

</html>
</body>

</html>
